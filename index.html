<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پزشک‌یار | مدیریت سفارش</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --p:#22c55e;--p2:#16a34a;--p3:#4ade80;--ps:#dcfce7;--pd:#14532d;
  --bg:#f3faf6;--sf:#fff;--sf2:#eef8f2;--tx:#0b1f16;--mu:#4d6558;--ln:#d5ebdd;
  --dang:#dc2626;--warn:#d97706;--ok:#16a34a;--sh:0 10px 30px rgba(16,80,45,.08);
  --inv:#fff;--invt:#111;--r:16px;
}
html.dark{
  --p:#4ade80;--p2:#86efac;--p3:#86efac;--ps:#14532d;--pd:#052e16;
  --bg:#070b09;--sf:#101614;--sf2:#0c1210;--tx:#ecfdf5;--mu:#9cb5a8;--ln:#1f2e26;
  --dang:#f87171;--warn:#fbbf24;--ok:#4ade80;--sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,Arial,sans-serif;min-height:100%}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--p2)}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:52px;width:auto;max-width:140px;object-fit:contain}
html.dark .brand img{filter:invert(1) brightness(1.15)}
.brand-meta b{display:block;font-size:18px;letter-spacing:-.02em}
.ver{font-size:12px;color:var(--mu)}
.top-mid{display:flex;flex-direction:column;align-items:center}
.clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;letter-spacing:.06em;color:var(--p2)}
.shamsi{font-size:13px;color:var(--mu)}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{border:1px solid var(--ln);background:var(--sf);color:var(--tx);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--p)}
.wrap{width:min(1180px,calc(100% - 28px));margin:18px auto 88px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dash-card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 12px;box-shadow:var(--sh);text-align:center;transition:.2s transform,.2s border-color;width:100%;height:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.dash-card:hover{transform:translateY(-3px);border-color:var(--p)}
.dash-ico{width:58px;height:58px;border-radius:16px;background:var(--ps);color:var(--p2);display:grid;place-items:center;font-size:28px;flex:none;margin:0 auto}
.dash-card .dash-txt{width:100%;text-align:center}
.dash-card h3{margin:0;font-size:13px;line-height:1.35;text-align:center}
.dash-card p{margin:4px 0 0;color:var(--mu);font-size:11px;line-height:1.35;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-size:20px;margin-top:4px}
.stat span{color:var(--mu);font-size:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:12px;color:var(--mu)}
.inp,select,textarea{width:100%;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);border-radius:12px;padding:10px 12px;outline:none}
.inp:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 20%,transparent)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--ps);color:var(--pd)}
html.dark .btn{color:#ecfdf5}
.btn-p{background:linear-gradient(135deg,var(--p),var(--p2));color:#052e16}
.btn-d{background:color-mix(in srgb,var(--dang) 16%,var(--sf));color:var(--dang)}
.btn-g{background:transparent;border:1px solid var(--ln);color:var(--tx)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.search{position:relative}
.search .sug{position:absolute;inset-inline:0;top:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;max-height:240px;overflow:auto;z-index:30;display:none;box-shadow:var(--sh)}
.search .sug.open{display:block}
.search .sug div{padding:8px 12px;cursor:pointer}
.search .sug div:hover{background:var(--ps)}
.order-bar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.order-bar .grow{flex:1;min-width:200px}
.cust-block{width:100%}
.cust-ico{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--p2);display:grid;place-items:center;flex:none}
.cust-ico.on,.cust-ico:hover{border-color:var(--p);background:var(--ps)}
.cust-box{display:none;position:relative;margin:10px 0 4px;padding:14px;border:1px solid var(--p);border-radius:14px;background:var(--sf2)}
.cust-box.open{display:block}
.cust-box:before{content:"";position:absolute;top:-6px;inset-inline-start:16px;width:11px;height:11px;background:var(--sf2);border-inline-start:1px solid var(--p);border-top:1px solid var(--p);transform:rotate(45deg)}
.sel-hint{font-size:11px;color:var(--mu);margin-top:4px}
.pick-bar{display:flex;align-items:flex-end;gap:8px}
.pick-bar .grow{flex:1;min-width:0}
.pick-bar .cust-ico{margin-bottom:10px}
.sug .sug-empty{padding:10px 12px;color:var(--mu);cursor:default}
.unit-new{margin-top:6px}
.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:720px;margin:24px auto}
.hub-ico{background:var(--sf);border:1px solid var(--ln);border-radius:20px;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh);color:var(--tx);padding:16px 12px;text-align:center}
.hub-ico:hover{border-color:var(--p);transform:translateY(-3px)}
.hub-ico .mark{width:64px;height:64px;border-radius:18px;background:var(--ps);color:var(--p2);display:grid;place-items:center}
.hub-ico b{font-size:15px}
.hub-ico span{font-size:12px;color:var(--mu);text-align:center;line-height:1.5}
@media (max-width:700px){.hub{grid-template-columns:1fr;max-width:280px}}
.mat-list{border:1px solid var(--ln);border-radius:14px;max-height:320px;overflow:auto;background:var(--sf2)}
.mat-row{display:grid;grid-template-columns:28px 1fr auto 90px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);margin:0;font-size:13px}
.mat-row:last-child{border-bottom:0}
.pmeta{margin-top:8px;font-size:13px;color:var(--mu)}
.pmeta b{color:var(--tx)}
.table-wrap{overflow:auto;border:1px solid var(--ln);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 12px;border-bottom:1px solid var(--ln);text-align:right;font-size:13px}
th{background:var(--sf2);color:var(--mu);font-weight:700}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:color-mix(in srgb,var(--ps) 55%,transparent)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;background:var(--ps);color:var(--pd);font-weight:700}
html.dark .badge{color:#ecfdf5}
.badge.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.d{background:color-mix(in srgb,var(--dang) 16%,transparent);color:var(--dang)}
.badge.n{background:var(--sf2);color:var(--mu)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:7px 12px;font-weight:700}
.chip.on{background:var(--p);color:#052e16;border-color:var(--p)}
.statusbar{position:fixed;bottom:14px;inset-inline-end:14px;z-index:50;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:6px 10px;font-size:11px;box-shadow:var(--sh)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--dang)}
.dot.warn{background:var(--warn)}
.overlay,.modal-bg{position:fixed;inset:0;background:rgba(6,16,12,.55);display:none;place-items:center;z-index:80;padding:18px}
.overlay.show,.modal-bg.show{display:grid}
.modal{width:min(520px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:22px}
.lock{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 86%,transparent);display:grid;place-items:center;z-index:90;text-align:center}
.lock.hide{display:none;pointer-events:none}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--ln);border-top-color:var(--p);animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toastbox{position:fixed;bottom:58px;left:14px;right:auto;z-index:100;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-start;max-width:min(360px,calc(100% - 28px))}
.toast{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;box-shadow:var(--sh);min-width:200px;text-align:right}
.empty{padding:28px;text-align:center;color:var(--mu)}
.qty{width:84px}
.a4-stage{background:#6b7280;padding:18px;border-radius:16px;overflow:auto}
.a4{width:210mm;min-height:297mm;background:#fff;color:#111;margin:0 auto 16px;padding:12mm 12mm 14mm;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.a4.land{width:297mm;height:210mm;min-height:210mm;padding:7mm 9mm 8mm;overflow:hidden}
.a4 *{color:#111}
.a4 table{min-width:0}
.a4 th{background:#f3f4f6;color:#333}
.inv-head{display:grid;grid-template-columns:1.1fr 1fr 1.1fr;align-items:center;gap:8px;margin-bottom:6px}
.inv-meta{font-size:13px;font-weight:800;line-height:1.85}
.inv-title{font-size:26px;font-weight:900;text-align:center;letter-spacing:-.02em}
.inv-logo-py{height:54px;width:auto;justify-self:end;object-fit:contain}
.inv-sheet{width:100%;border-collapse:collapse;table-layout:fixed}
.inv-sheet th,.inv-sheet td{border:1px solid #111 !important;padding:5px 6px !important;background:#fff !important;color:#111 !important;text-align:center;font-size:12px;font-weight:400}
.inv-sheet th.sec{font-weight:800;font-size:13px}
.inv-sheet td.start{text-align:right}
.inv-sheet .name-col{width:28%}
.inv-sheet .num-col{width:16%}
.inv-sign{display:flex;justify-content:space-between;margin-top:16px;padding:0 8px;font-size:13px}
.inv-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid #22c55e;padding-bottom:10px;margin-bottom:12px}
.inv-logo{height:58px}
.muted{color:var(--mu);font-size:12px}
.hidden{display:none !important}
.coll{overflow:hidden;max-height:0;transition:.25s}
.coll.open{max-height:900px}
hr.sep{border:0;border-top:1px solid var(--ln);margin:14px 0}
.os-badge{font-size:11px;color:var(--mu);background:var(--sf2);border:1px solid var(--ln);border-radius:999px;padding:3px 8px;white-space:nowrap}
.mob-nav,.mob-sheet{display:none}
@media (max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .stats,.grid-2,.grid-3{grid-template-columns:1fr}
  .hub{grid-template-columns:1fr 1fr;max-width:none}
}
@media (max-width:720px), html.is-mobile {
  .top-actions .btn-g{display:none}
  .brand-meta b{font-size:15px}
  .brand img{height:40px}
  .clock{font-size:16px}
  .shamsi{font-size:11px;max-width:42vw;text-align:center}
  .wrap{width:calc(100% - 16px);margin:12px auto 108px}
  .page-head h1{font-size:20px}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .dash-ico{width:52px;height:52px;font-size:24px}
  .dash-card{padding:14px 8px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .order-bar{flex-direction:column;align-items:stretch}
  .order-bar .grow,.order-bar .field{width:100% !important;min-width:0}
  .order-bar .btn,.order-bar .cust-ico{min-height:48px}
  .cust-ico{width:48px}
  .btn,.inp,select,textarea{min-height:48px;font-size:16px !important;border-radius:14px}
  .icon-btn{width:44px;height:44px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
  table{min-width:640px}
  th,td{padding:12px 10px;font-size:13px}
  .statusbar{left:10px;right:10px;inset-inline:10px;bottom:calc(72px + env(safe-area-inset-bottom));justify-content:center}
  .toastbox{bottom:calc(78px + env(safe-area-inset-bottom));left:10px}
  .modal{width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 12px 12px}
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:2px}
  .mob-nav button{flex:1;border:0;background:transparent;color:var(--mu);font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .mob-nav button .mi{font-size:18px;line-height:1}
  .mob-nav button.on{color:var(--p2);background:var(--ps)}
  .mob-sheet{display:none;position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:71;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px;box-shadow:var(--sh)}
  .mob-sheet.open{display:block}
  .mob-sheet button{width:100%;text-align:right;border:0;background:transparent;padding:12px 10px;border-radius:10px;color:var(--tx);font-weight:700}
  .mob-sheet button:active{background:var(--ps)}
}
html.os-ios .btn,html.os-ios .inp,html.os-ios select,html.os-ios textarea{-webkit-appearance:none}
html.os-ios input,html.os-ios select,html.os-ios textarea{font-size:16px}
html.os-ios .app{min-height:100dvh;padding-top:env(safe-area-inset-top)}
html.os-android .btn{border-radius:10px}
html.os-android .dash-card,html.os-android .card{border-radius:12px}
html.is-touch .dash-card:hover,html.is-touch .hub-ico:hover{transform:none}
html.is-touch .btn:active,html.is-touch .dash-card:active{transform:scale(.98)}
@media (max-width:520px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .hub{grid-template-columns:1fr}
}
@media print{
  body *{visibility:hidden}
  #print-root,#print-root *{visibility:visible}
  #print-root{position:absolute;inset:0}
  .a4{box-shadow:none;margin:0;page-break-after:always}
  .a4.land{page-break-after:always}
}
@page{size:A4 landscape;margin:0}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand" data-go="dashboard" style="cursor:pointer">
      <img src="logo.png" alt="PezeshkYar" id="brandLogo">
      <div class="brand-meta">
        <b>پزشک‌یار</b>

      <button class="btn btn-g" data-go="dashboard">داشبورد</button>

</div>

  <button type="button" data-go="products">▣ محصولات و مواد</button>
</div>
<div class="statusbar" id="statusbar"></div>
<div class="lock" id="lock"><div><div class="spinner"></div><div>در حال بازیابی اطلاعات از Google Sheets…<><div>در حال بازیابی اطلاعات از Google Sheets…</div><div class="muted" id="lockMsg">لطفاً صبر کنید</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const APP = {
  name: 'PezeshkYar',
  nameFa: 'پزشک‌یار',
  version: 'v.1.1.25',
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyUDYfULHdPXBdy_zESpCGCUnnNPpuog7db8CQL-ov1F97nZbbEOfQzTxI-punxopBoWQ/exec',
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1GGHSNreSBvbgYwhxfQuR8xDjIvGxRNUqynz1Cgytkfs/edit?usp=sharing',
  APP_TOKEN: 'PEZESHKYAR_BACKUP_2026',
  INVOICE_START: 965111,
  SELLER_PHONE: '09358379693',
  IBAN: 'IR260120010000009679321203',
  CARD: '8703 7096 3389 6104',
  ACCOUNT: 'علی پزشک مفرنقاه',
  CATEGORY: 'محصولات'
};

const KEYS = ['customers','products','materials','productMaterials','orders','orderItems','payments','purchases','socialOrders'];
const DB = { settings: { invoiceCounter: APP.INVOICE_START } };
KEYS.forEach(k => DB[k] = []);
const dirty = {};
KEYS.forEach(k => dirty[k] = new Set());

let route = { page: 'dashboard', id: null };
let ready = false;
let syncing = false;
let lastSync = null;
let lastError = '';
let queueCount = 0;
let settingsDirty = false;

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const num = v => { const n = parseFloat(String(v??'').replace(/,/g,'')); return isNaN(n) ? 0 : n; };
const money = v => num(v).toLocaleString('en-US') + ' تومان';
const faDigits = s => String(s??'').replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const faMoney = v => faDigits(Math.round(num(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '،'));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowIso = () => new Date().toISOString();
const alive = arr => (arr||[]).filter(x => String(x.deleted) !== '1');
const byId = (arr,id) => (arr||[]).find(x => String(x.id)===String(id));
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function g2j(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2 = gm>2 ? gy+1 : gy;
  let days = 355666 + 365*gy + ~~((gy2+3)/4) - ~~((gy2+99)/100) + ~~((gy2+399)/400) + gd + g_d_m[gm-1];
  let jy = -1595 + 33*~~(days/12053); days%=12053;
  jy += 4*~~(days/1461); days%=1461;
  if(days>365){ jy+=~~((days-1)/365); days=(days-1)%365; }
  const jm = days<186 ? 1+~~(days/31) : 7+~~((days-186)/30);
  const jd = 1 + (days<186 ? days%31 : (days-186)%30);
  return {jy,jm,jd};
}
function j2g(jy,jm,jd){
  jy+=1595;
  let days = -355668 + 365*jy + ~~(jy/33)*8 + ~~((jy%33+3)/4) + jd + (jm<7?(jm-1)*31:(jm-7)*30+186);
  let gy = 400*~~(days/146097); days%=146097;
  if(days>36524){ gy+=100*~~(--days/36524); days%=36524; if(days>=365) days++; }
  gy += 4*~~(days/1461); days%=1461;
  if(days>365){ gy+=~~((days-1)/365); days=(days-1)%365; }
  let gd=days+1, sal_a=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31], gm=0;
  for(gm=1;gm<=12&&gd>sal_a[gm];gm++) gd-=sal_a[gm];
  return {gy,gm,gd};
}
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JW=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function shamsiStr(d=new Date()){
  const j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${JW[d.getDay()]} ${j.jd} ${JM[j.jm-1]} ${j.jy}`;
}
function shamsiShort(d=new Date()){
  const j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')}`;
}
function parseShamsi(s){
  const m=String(s||'').match(/(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(!m) return new Date();
  const g=j2g(+m[1],+m[2],+m[3]);
  return new Date(g.gy,g.gm-1,g.gd);
}

async function resolveSalePrice(p, typedPrice){
  const oldCost=num(p.materialCost);
  const newCost=productCost(p);
  const oldPrice=productSale(p);
  const typed=num(typedPrice);
  const basePrice=typed||oldPrice;
  if(!(oldCost>0 && newCost>oldCost+0.5)) return {price:basePrice, cost:newCost};
  const pct=productProfitPct(p, oldCost);
  const suggested=Math.round(newCost*(1+pct/100));
  const ans=await priceAlert({oldCost,newCost,profitPct:pct,oldPrice:basePrice,suggested});
  if(!ans.keepOld){
    snapshotProduct(p, ans.price, newCost);
    upsertLocal('products', p);
  }
  return {price:ans.price, cost:newCost};
}

function persistLocal(){
  try{
    localStorage.setItem('py_db', JSON.stringify(DB));
    const d={};
    KEYS.forEach(k=>d[k]=[...dirty[k]]);
    localStorage.setItem('py_dirty', JSON.stringify(d));
    queueCount = KEYS.reduce((a,k)=>a+dirty[k].size,0);
  }catch(e){}
}
function loadLocal(){
  try{
    const raw=localStorage.getItem('py_db');
    if(raw){
      const o=JSON.parse(raw);
      KEYS.forEach(k=>{ if(Array.isArray(o[k])) DB[k]=o[k]; });
      if(o.settings) DB.settings=o.settings;
    }
    const dd=JSON.parse(localStorage.getItem('py_dirty')||'{}');
    KEYS.forEach(k=> (dd[k]||[]).forEach(id=>dirty[k].add(id)));
    queueCount = KEYS.reduce((a,k)=>a+dirty[k].size,0);
  }catch(e){}
}
function mark(col, id){ dirty[col].add(String(id)); persistLocal(); }
function addCustomer(name, phone, address){
  name=String(name||'').trim();
  phone=String(phone||'').trim();
  address=String(address||'').trim();
  if(!name || !phone){ toast('نام و شماره تماس را وارد کنید', false); return null; }
  const exist=alive(DB.customers).find(c=>c.phone===phone);
  if(exist){
    exist.name=name; exist.address=address||exist.address;
    upsertLocal('customers', exist);
    toast('مشتری به‌روز شد');
    return exist;
  }
  const c={id:uid('cus'), name, phone, address, deleted:'0'};
  upsertLocal('customers', c);
  toast('مشتری ذخیره شد');
  flush();
  return c;
}
function upsertLocal(col, rec){
  rec.updatedAt = nowIso();
  if(!rec.createdAt) rec.createdAt = rec.updatedAt;
  if(rec.deleted==null) rec.deleted='0';
  const i=DB[col].findIndex(x=>String(x.id)===String(rec.id));
  if(i>=0) DB[col][i]=rec; else DB[col].push(rec);
  mark(col, rec.id);
  return rec;
}

async function api(action, payload={}){
  const body=JSON.stringify({action, token:APP.APP_TOKEN, ...payload});
  const res=await fetch(APP.SCRIPT_URL,{
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body
  });
  if(!res.ok) throw new Error('خطای شبکه '+res.status);
  return res.json();
}

async function bootstrap(){
  $('#lockMsg').textContent='ارتباط با سرور بکاپ…';
  const data=await api('bootstrap');
  if(!data.ok) throw new Error(data.error||'بازیابی ناموفق');
  KEYS.forEach(k=>{
    if(!Array.isArray(data.data[k])) return;
    const map=new Map(data.data[k].map(r=>[String(r.id), r]));
    (DB[k]||[]).forEach(r=>{
      if(dirty[k] && dirty[k].has(String(r.id))) map.set(String(r.id), r);
    });
    DB[k]=[...map.values()];
  });
  const prevSvc=DB.settings && DB.settings.serviceNames;
  const prevUnits=DB.settings && DB.settings.unitNames;
  DB.settings = Object.assign({invoiceCounter:APP.INVOICE_START}, data.data.settings||{});
  try{
    const a=parseJsonArr(prevSvc);
    const b=parseJsonArr(DB.settings.serviceNames);
    DB.settings.serviceNames=JSON.stringify(mergeSvcLists(a,b));
  }catch(e){ if(prevSvc && !DB.settings.serviceNames) DB.settings.serviceNames=prevSvc; }
  try{
    const a=parseJsonArr(prevUnits);
    const b=parseJsonArr(DB.settings.unitNames);
    DB.settings.unitNames=JSON.stringify([...new Set([...a,...b].map(s=>String(s||'').trim()).filter(Boolean))]);
  }catch(e){ if(prevUnits && !DB.settings.unitNames) DB.settings.unitNames=prevUnits; }
  lastSync=new Date(); lastError='';
  persistLocal();
}

async function flush(){
  if(syncing || !navigator.onLine) return;
  const collections={}; let any=false;
  KEYS.forEach(k=>{
    if(!dirty[k].size) return;
    collections[k]=DB[k].filter(r=>dirty[k].has(String(r.id)));
    if(collections[k].length) any=true;
  });
  if(!any && !settingsDirty) return;
  syncing=true; renderStatus();
  try{
    const r=await api('sync',{collections, settings:DB.settings});
    if(!r.ok) throw new Error(r.error||'ذخیره ناموفق');
    KEYS.forEach(k=>dirty[k].clear());
    settingsDirty=false;
    lastSync=new Date(); lastError='';
    persistLocal();
  }catch(e){
    lastError=e.message||'خطای بکاپ';
  }finally{
    syncing=false; renderStatus();
  }
}

async function nextInvoice(){
  try{
    const r=await api('nextInvoice');
    if(r.ok && r.invoiceNo){
      DB.settings.invoiceCounter = Number(r.invoiceNo)+1;
      return Number(r.invoiceNo);
    }
  }catch(e){}
  let n=num(DB.settings.invoiceCounter)||APP.INVOICE_START;
  alive(DB.orders).forEach(o=>{ const x=num(o.invoiceNo); if(x>=n) n=x+1; });
  if(n<APP.INVOICE_START) n=APP.INVOICE_START;
  DB.settings.invoiceCounter=n+1;
  return n;
}

function detectPlatform(){
  const ua=navigator.userAgent||'';
  const plat=navigator.platform||'';
  const touch=('ontouchstart' in window) || navigator.maxTouchPoints>0;
  const narrow=Math.min(window.innerWidth||999, screen.width||999)<820;
  const uaMob=/Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry/i.test(ua);
  const mobile=uaMob || (touch && narrow);
  let os='other';
  if(/iPhone|iPad|iPod/i.test(ua) || (plat==='MacIntel' && navigator.maxTouchPoints>1)) os='ios';
  else if(/Android/i.test(ua)) os='android';
  else if(/Windows Phone/i.test(ua)) os='android';
  else if(/Win/i.test(plat)||/Windows/i.test(ua)) os='windows';
  else if(/Mac/i.test(plat)||/Mac OS/i.test(ua)) os='mac';
  else if(/Linux/i.test(ua)) os='linux';
  const root=document.documentElement;
  root.classList.toggle('is-mobile', !!mobile);
  root.classList.toggle('is-touch', !!touch);
  ['ios','android','windows','mac','linux','other'].forEach(x=>root.classList.remove('os-'+x));
  root.classList.add('os-'+os);
  document.body.dataset.os=os;
  const lab={ios:'iOS · آیفون/آیپد',android:'اندروید',windows:'ویندوز',mac:'مک',linux:'لینوکس',other:'دستگاه'}[os];
  const badge=$('#osBadge');
  if(badge) badge.textContent=lab+(mobile?' · موبایل':' · دسکتاپ');
  const tc=$('#themeColor');
  if(tc) tc.setAttribute('content', root.classList.contains('dark')?'#0a0f0d':'#22c55e');
  return {os, mobile, touch};
}

function productCost(p){
  if(!p) return 0;
  const bom=alive(DB.productMaterials).filter(b=>b.productId===p.id);
  if(bom.length){
    return bom.reduce((s,b)=>{
      const m=byId(DB.materials,b.materialId);
      return s + num(m&&m.unitCost)*num(b.qty);
    },0);
  }
  return num(p.materialCost);
}
function productSale(p){
  if(!p) return 0;
  return num(p.salePrice) || num(p.priceTier1);
}
function productProfitPct(p, cost){
  const c = cost!=null ? num(cost) : productCost(p);
  const s = productSale(p);
  if(c>0) return ((s-c)/c)*100;
  return num(p&&p.profitPct);
}
function pctTxt(v){
  const n=num(v);
  if(!isFinite(n)) return '۰٪';
  return (Math.round(n*10)/10).toLocaleString('fa-IR') + '٪';
}
function snapshotProduct(p, sale, cost){
  p.salePrice=num(sale);
  p.priceTier1=num(sale);
  p.priceTier2=0; p.priceTier3=0;
  p.materialCost=num(cost);
  p.profitPct = cost>0 ? ((sale-cost)/cost)*100 : 0;
  return p;
}
function orderItems(oid){ return alive(DB.orderItems).filter(i=>i.orderId===oid); }
function totalsOf(oid){
  const items=orderItems(oid);
  const totalSale=items.reduce((s,i)=>s+num(i.saleAmount),0);
  const totalMaterial=items.reduce((s,i)=>s+num(i.materialCost)*num(i.qty),0);
  return {totalSale,totalMaterial,totalProfit:totalSale-totalMaterial,count:items.length};
}
function refreshOrderTotals(order){
  const t=totalsOf(order.id);
  order.totalSale=t.totalSale; order.totalMaterial=t.totalMaterial; order.totalProfit=t.totalProfit;
  return order;
}
function ledger(cid){
  const orders=alive(DB.orders).filter(o=>o.customerId===cid)
    .sort((a,b)=>String(a.dateGregorian).localeCompare(String(b.dateGregorian))||num(a.invoiceNo)-num(b.invoiceNo));
  const pays=alive(DB.payments).filter(p=>p.customerId===cid)
    .sort((a,b)=>String(a.dateGregorian).localeCompare(String(b.dateGregorian))||String(a.createdAt).localeCompare(String(b.createdAt)));
  const rows=orders.map(o=>({order:o, sale:num(o.totalSale), paid:0, bal:num(o.totalSale)}));
  pays.forEach(p=>{
    let left=num(p.amount);
    rows.forEach(r=>{
      if(left<=0) return;
      const take=Math.min(left,r.bal);
      r.paid+=take; r.bal=Math.round((r.bal-take)*100)/100; left-=take;
    });
  });
  const totalSale=rows.reduce((s,r)=>s+r.sale,0);
  const totalPaid=pays.reduce((s,p)=>s+num(p.amount),0);
  const debt=rows.reduce((s,r)=>s+r.bal,0);
  return {orders:rows, pays, totalSale, totalPaid, debt};
}
function applySettleFlags(cid){
  const L=ledger(cid);
  L.orders.forEach(r=>{
    const o=r.order;
    if(r.bal<=0.5 && num(o.totalSale)>0){
      if(o.status!=='تسویه شده'){ o.status='تسویه شده'; upsertLocal('orders',o); }
    }else if(o.status==='تسویه شده'){
      o.status = num(o.stage)>=4 ? 'تحویل داده شده' : 'آماده‌سازی';
      upsertLocal('orders',o);
    }
  });
}

function bindNewOrder(){
  const fillCustomer = c => {
    draft.customerId=c.id; draft.customerName=c.name; draft.customerPhone=c.phone; draft.customerAddress=c.address||'';
    $('#cName').value=c.name||''; $('#cPhone').value=c.phone||''; $('#cAddr').value=c.address||'';
    $('#cSearch').value = `${c.name||''}${c.phone?' — '+c.phone:''}`;
  };
  const openList = (box, items, htmlFn, onPick) => {
    box.classList.toggle('open', !!items.length);
    box.innerHTML = items.length ? items.map(htmlFn).join('') : '<div class="muted">موردی یافت نشد</div>';
    if(!items.length) box.classList.add('open');
    [...box.children].forEach((el,i)=>{
      if(!items[i]) return;
      el.onclick=()=>{ onPick(items[i]); box.classList.remove('open'); };
    });
  };
  const showCustomers = q => openList($('#cSug'), customerSuggest(q),
    c=>`<div>${esc(c.name)} — ${esc(c.phone)}</div>`,
    c=>fillCustomer(c)
  );
  $('#cSearch').addEventListener('focus', e=>showCustomers(e.target.value.includes(' — ')?'':e.target.value));
  $('#cSearch').addEventListener('input', e=>showCustomers(e.target.value));
  let picked=null;
  const fillPrice=()=>{
    if(!picked) return;
    const cost=productCost(picked);
    const sale=productSale(picked);
    $('#pPrice').value = sale || '';
    if($('#pMeta')) $('#pMeta').innerHTML=`واحد: <b>${esc(picked.unit||'عدد')}</b> — قیمت تمام‌شده: <b>${money(cost)}</b> — درصد سود: <b>${pctTxt(productProfitPct(picked,cost))}</b>`;
  };
  const showProducts = q => openList($('#pSug'), productSuggest(q),
    p=>`<div>${esc(p.code)} — ${esc(p.name)} <span class="muted">${esc(p.unit||'عدد')}</span></div>`,
    p=>{ picked=p; $('#pId').value=p.id; $('#pSearch').value=p.name; fillPrice(); }
  );
  $('#pSearch').addEventListener('focus', e=>showProducts(e.target.value));
  $('#pSearch').addEventListener('input', e=>showProducts(e.target.value));
  const closePanels = except => {
    [['cusBox','togCust'],['newCusBox','togNewCus'],['newPrBox','togNewPr']].forEach(([box,btn])=>{
      if(except===box) return;
      const b=$( '#'+box), i=$('#'+btn);
      if(b) b.classList.remove('open');
      if(i) i.classList.remove('on');
    });
  };
  $('#togCust').onclick=()=>{
    const open=$('#cusBox').classList.toggle('open');
    $('#togCust').classList.toggle('on', open);
    if(open) closePanels('cusBox');
  };
  $('#togNewCus').onclick=()=>{
    const open=$('#newCusBox').classList.toggle('open');
    $('#togNewCus').classList.toggle('on', open);
    if(open) closePanels('newCusBox');
  };
  $('#togNewPr').onclick=()=>{
    const open=$('#newPrBox').classList.toggle('open');
    $('#togNewPr').classList.toggle('on', open);
    if(open) closePanels('newPrBox');
    bindUnitSelects($('#newPrBox'));
  };
  bindUnitSelects($('#newPrBox'));
  $('#saveNewCus').onclick=()=>{
    const name=$('#ncName').value.trim(), phone=$('#ncPhone').value.trim();
    if(!name||!phone){ toast('نام و شماره تماس مشتری لازم است',false); return; }
    const c={id:uid('cus'),name,phone,address:$('#ncAddr').value.trim(),deleted:'0'};
    upsertLocal('customers',c);
    fillCustomer(c);
    $('#newCusBox').classList.remove('open');
    $('#togNewCus').classList.remove('on');
    toast('مشتری جدید ذخیره شد');
  };
  $('#saveNewPr').onclick=()=>{
    const name=$('#npName').value.trim();
    const cost=num($('#npCost').value);
    if(!name){ toast('نام محصول لازم است',false); return; }
    if(!cost){ toast('قیمت تمام‌شده را وارد کنید',false); return; }
    const rec=snapshotProduct({id:uid('prd'),code:'P'+Date.now().toString().slice(-6),name,category:APP.CATEGORY,unit:readUnit('#npUnit','عدد'),notes:'',deleted:'0'}, cost, cost);
    upsertLocal('products',rec);
    picked=rec;
    $('#pId').value=rec.id;
    $('#pSearch').value=rec.name;
    $('#pPrice').value=cost;
    $('#newPrBox').classList.remove('open');
    $('#togNewPr').classList.remove('on');
    toast('محصول جدید ذخیره شد');
  };
  const grabDraft=()=>{
    draft.customerName=$('#cName').value.trim();
    draft.customerPhone=$('#cPhone').value.trim();
    draft.customerAddress=$('#cAddr').value.trim();
    draft.dateShamsi=$('#cDate').value.trim();
    draft.notes=$('#oNotes').value.trim();
    draft.dateGregorian=parseShamsi(draft.dateShamsi).toISOString();
    if(!draft.customerName){
      const raw=($('#cSearch').value||'').split('—')[0].trim();
      if(raw) draft.customerName=raw;
    }
  };
  $('#addItem').onclick=async()=>{
    if(!picked){ toast('ابتدا محصول را انتخاب کنید',false); return; }
    const qty=Math.max(1,num($('#pQty').value));
    const decided=await resolveSalePrice(picked, $('#pPrice').value);
    const price=decided.price;
    const mc=decided.cost;
    const sale=qty*price;
    draft.items.push({
      id:uid('oit'), productId:picked.id, productCode:picked.code, productName:picked.name,
      qty, producedQty:0, priceTier:'', unitPrice:price, unit:picked.unit||'عدد',
      materialCost:mc, saleAmount:sale, profit:sale-mc*qty
    });
    grabDraft(); render();
  };
  $$('[data-edit-qty]').forEach(inp=>inp.onchange=()=>{
    const it=draft.items[+inp.dataset.editQty];
    it.qty=Math.max(1,num(inp.value));
    it.saleAmount=it.qty*num(it.unitPrice);
    it.profit=it.saleAmount-num(it.materialCost)*it.qty;
    grabDraft(); render();
  });
  $$('[data-del-item]').forEach(btn=>btn.onclick=async()=>{
    if(await confirmBox('حذف محصول','این کالا از لیست سفارش حذف شود؟')){
      draft.items.splice(+btn.dataset.delItem,1); grabDraft(); render();
    }
  });
  $('#saveOrder').onclick=()=>saveDraft(false);
  $('#previewInv').onclick=()=>saveDraft(true);
}

async function saveDraft(openInv){
  draft.customerName=$('#cName').value.trim();
  draft.customerPhone=$('#cPhone').value.trim();
  draft.customerAddress=$('#cAddr').value.trim();
  draft.dateShamsi=$('#cDate').value.trim();
  draft.notes=$('#oNotes').value.trim();
  draft.dateGregorian=parseShamsi(draft.dateShamsi).toISOString();
  if(!draft.customerName || !draft.customerPhone){ toast('نام و شماره مشتری الزامی است',false); return; }
  if(!draft.items.length){ toast('حداقل یک محصول اضافه کنید',false); return; }
  for(const it of draft.items){
    const p=byId(DB.products,it.productId);
    if(!p) continue;
    const decided=await resolveSalePrice(p, it.unitPrice);
    it.unitPrice=decided.price;
    it.materialCost=decided.cost;
    it.saleAmount=num(it.qty)*decided.price;
    it.profit=it.saleAmount-decided.cost*num(it.qty);
  }
  if(!draft.customerId){
    const exist=alive(DB.customers).find(c=>c.phone===draft.customerPhone);
    if(exist) draft.customerId=exist.id;
    else{
      const c={id:uid('cus'), name:draft.customerName, phone:draft.customerPhone, address:draft.customerAddress, deleted:'0'};
      upsertLocal('customers',c); draft.customerId=c.id;
    }
  }else{
    const c=byId(DB.customers,draft.customerId);
    if(c){ c.name=draft.customerName; c.phone=draft.customerPhone; c.address=draft.customerAddress; upsertLocal('customers',c); }
  }
  if(!num(draft.invoiceNo)) draft.invoiceNo = await nextInvoice();
  const order={
    id:draft.id, invoiceNo:draft.invoiceNo, customerId:draft.customerId,
    customerName:draft.customerName, customerPhone:draft.customerPhone, customerAddress:draft.customerAddress,
    dateShamsi:draft.dateShamsi, dateGregorian:draft.dateGregorian, notes:draft.notes,
    stage:1, status:'آماده‌سازی', trackingCode:'', deleted:'0'
  };
  draft.items.forEach(it=>{
    upsertLocal('orderItems', Object.assign({},it,{orderId:order.id, deleted:'0'}));
  });
  refreshOrderTotals(order);
  upsertLocal('orders', order);
  applySettleFlags(order.customerId);
  const savedId=order.id;
  draft=null;
  toast('سفارش ذخیره شد');
  flush();
    if(openInv) showInvoice(savedId);
  else go('order', savedId);
}

function bindOrder(o){
  $$('[data-ren]').forEach(inp=>inp.onchange=()=>{
    const it=byId(DB.orderItems,inp.dataset.ren); it.productName=inp.value; upsertLocal('orderItems',it); toast('نام کالا در این سفارش تغییر کرد');
  });
  $$('[data-oqty]').forEach(inp=>inp.onchange=()=>{
    const it=byId(DB.orderItems,inp.dataset.oqty);
    it.qty=Math.max(1,num(inp.value)); it.saleAmount=it.qty*num(it.unitPrice); it.profit=it.saleAmount-num(it.materialCost)*it.qty;
    upsertLocal('orderItems',it); refreshOrderTotals(o); upsertLocal('orders',o); applySettleFlags(o.customerId); render();
  });
  $$('[data-prod]').forEach(inp=>inp.onchange=()=>{
    const it=byId(DB.orderItems,inp.dataset.prod); it.producedQty=Math.max(0,num(inp.value)); upsertLocal('orderItems',it); toast('تعداد تولید ذخیره شد');
  });
  $$('[data-del-oi]').forEach(btn=>btn.onclick=async()=>{
    if(!await confirmBox('حذف کالا','این محصول از سفارش حذف شود؟')) return;
    const it=byId(DB.orderItems,btn.dataset.delOi); it.deleted='1'; upsertLocal('orderItems',it);
    refreshOrderTotals(o); upsertLocal('orders',o); render();
  });
  $$('[data-stage]').forEach(btn=>btn.onclick=async()=>{
    const s=Number(btn.dataset.stage);
    if(s<Number(o.stage)){ toast('مرحله فقط به‌ترتیب جلو می‌رود',false); return; }
    if(s===4){
      const code=$('#trk').value.trim();
      if(!code){ toast('برای تحویل، کد پیگیری را وارد کنید',false); return; }
      o.trackingCode=code;
    }
    o.stage=s;
    if(s>=4 && o.status!=='تسویه شده') o.status='تحویل داده شده';
    upsertLocal('orders',o); toast('مرحله سفارش به‌روز شد'); render();
  });
  if($('#trk')) $('#trk').onchange=()=>{ o.trackingCode=$('#trk').value.trim(); upsertLocal('orders',o); };
  if($('#addToOrder')) $('#addToOrder').onclick=()=>openAddProduct(o);
}

function bindProductMats(){
  const recost=()=>{
    let cost=0;
    $$('#prMatList [data-pmid]').forEach(cb=>{
      if(!cb.checked) return;
      const m=byId(DB.materials,cb.dataset.pmid);
      const q=num(($(`[data-pmqty="${cb.dataset.pmid}"]`)||{}).value);
      cost += num(m&&m.unitCost)*q;
    });
    if(!cost) cost=num($('#prMc')&&$('#prMc').value);
    const sale=num($('#prSale')&&$('#prSale').value);
    if($('#prCostLive')) $('#prCostLive').textContent=money(cost);
    if($('#prPctLive')) $('#prPctLive').textContent=pctTxt(cost>0&&sale?((sale-cost)/cost)*100:0);
  };
  if($('#prMatList')){ $('#prMatList').oninput=recost; $('#prMatList').onchange=recost; }
  if($('#prSale')) $('#prSale').oninput=recost;
  if($('#prMc')) $('#prMc').oninput=recost;
  recost();
}
function bindFormulaLive(){
  const recost=()=>{
    let cost=0;
    $$('#matList [data-mid]').forEach(cb=>{
      if(!cb.checked) return;
      const m=byId(DB.materials,cb.dataset.mid);
      const q=num(($(`[data-mqty="${cb.dataset.mid}"]`)||{}).value);
      cost += num(m&&m.unitCost)*q;
    });
    const p=byId(DB.products, $('#bomP')&&$('#bomP').value);
    const sale=productSale(p);
    const pct=cost>0?((sale-cost)/cost)*100:0;
    if($('#bomCost')) $('#bomCost').textContent=money(cost);
    if($('#bomSale')) $('#bomSale').textContent=money(sale);
    if($('#bomPct')) $('#bomPct').textContent=pctTxt(pct);
  };
  const fillBom=()=>{
    const pid=$('#bomP')&&$('#bomP').value;
    const bom=alive(DB.productMaterials).filter(b=>b.productId===pid);
    $$('#matList [data-mid]').forEach(cb=>{
      const row=bom.find(b=>b.materialId===cb.dataset.mid);
      cb.checked=!!row;
      const q=$(`[data-mqty="${cb.dataset.mid}"]`);
      if(q) q.value=row?row.qty:1;
    });
    recost();
  };
  if($('#bomP')) $('#bomP').onchange=fillBom;
  if($('#matList')){ $('#matList').oninput=recost; $('#matList').onchange=recost; }
  recost();
}

const BASE_UNITS=['عدد','کیلوگرم','گرم','متر','سانتی‌متر','لیتر','بسته','کارتن','جفت','رول','ورق','متر مربع','دست','شانه','جعبه'];
function parseJsonArr(raw){
  try{ const v=JSON.parse(raw||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; }
}
function normalizeSvcList(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map(x=>{
    if(typeof x==='string') return {name:String(x).trim(), unit:'عدد'};
    return {name:String(x&&x.name||'').trim(), unit:String(x&&x.unit||'عدد').trim()||'عدد'};
  }).filter(x=>x.name);
}
function mergeSvcLists(a,b){
  const map=new Map();
  [...normalizeSvcList(a), ...normalizeSvcList(b)].forEach(s=>{
    const prev=map.get(s.name);
    if(!prev || (s.unit && s.unit!=='عدد')) map.set(s.name,s);
    else if(!map.has(s.name)) map.set(s.name,s);
  });
  return [...map.values()];
}
function serviceCatalog(){
  const map=new Map();
  normalizeSvcList(parseJsonArr(DB.settings.serviceNames)).forEach(s=>map.set(s.name,s));
  alive(DB.purchases).filter(p=>p.kind==='service').forEach(p=>{
    const name=String(p.title||'').trim();
    if(!name) return;
    const unit=String(p.unit||'').trim();
    const prev=map.get(name);
    if(!prev) map.set(name,{name, unit:unit||'عدد'});
    else if(unit) map.set(name,{name, unit});
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'fa'));
}
function addServiceToCatalog(name, unit){
  name=String(name||'').trim();
  if(!name) return '';
  if(!name.startsWith('خدمات')) name='خدمات '+name;
  unit=rememberUnit(unit||'عدد');
  const list=normalizeSvcList(parseJsonArr(DB.settings.serviceNames));
  const i=list.findIndex(x=>x.name===name);
  if(i>=0){ if(unit) list[i].unit=unit; }
  else list.push({name, unit});
  DB.settings.serviceNames=JSON.stringify(list);
  settingsDirty=true;
  persistLocal();
  return name;
}
function knownUnits(){
  const extra=parseJsonArr(DB.settings.unitNames).map(s=>String(s||'').trim());
  const fromItems=[
    ...alive(DB.materials).map(m=>m.unit),
    ...alive(DB.products).map(p=>p.unit),
    ...alive(DB.purchases).map(p=>p.unit),
    ...serviceCatalog().map(s=>s.unit)
  ].map(s=>String(s||'').trim());
  const all=[...new Set([...BASE_UNITS, ...extra, ...fromItems].filter(Boolean))];
  all.sort((a,b)=>{
    if(a==='عدد') return -1;
    if(b==='عدد') return 1;
    return a.localeCompare(b,'fa');
  });
  return all;
}
function rememberUnit(u){
  u=String(u||'').trim();
  if(!u || u==='__new__') return 'عدد';
  const extra=parseJsonArr(DB.settings.unitNames);
  if(!BASE_UNITS.includes(u) && !extra.includes(u)){
    extra.push(u);
    DB.settings.unitNames=JSON.stringify(extra);
    settingsDirty=true;
    persistLocal();
  }
  return u;
}
function unitSelectHTML(id, selected){
  const cur=String(selected||'عدد').trim()||'عدد';
  const units=knownUnits();
  if(cur && !units.includes(cur)) units.unshift(cur);
  const opts=units.map(u=>`<option value="${esc(u)}" ${u===cur?'selected':''}>${esc(u)}</option>`).join('');
  return `<select class="inp" id="${id}" data-unit-sel="1">${opts}<option value="__new__">＋ واحد جدید…</option></select>`;
}
function bindUnitSelects(root){
  $$('[data-unit-sel]', root||document).forEach(sel=>{
    if(sel.dataset.bound==='1') return;
    sel.dataset.bound='1';
    sel.addEventListener('change', ()=>{
      if(sel.value!=='__new__'){ rememberUnit(sel.value); return; }
      const wrap=sel.closest('.field')||sel.parentElement;
      let extra=wrap.querySelector('.unit-new');
      if(!extra){
        extra=document.createElement('input');
        extra.className='inp unit-new';
        extra.setAttribute('autocomplete','off');
        extra.placeholder='نام واحد را بنویسید';
        wrap.appendChild(extra);
      }
      extra.value='';
      extra.focus();
      const commit=()=>{
        const u=(extra.value||'').trim();
        if(extra.parentNode) extra.remove();
        if(!u){ sel.value='عدد'; return; }
        rememberUnit(u);
        if(![...sel.options].some(o=>o.value===u)){
          const opt=document.createElement('option');
          opt.value=u; opt.textContent=u;
          const last=[...sel.options].find(o=>o.value==='__new__');
          sel.insertBefore(opt, last||null);
        }
        sel.value=u;
      };
      extra.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } };
      extra.onblur=()=>setTimeout(commit, 120);
    });
  });
}
function readUnit(id, fallback){
  const el=$(id);
  let u=el ? String(el.value||'').trim() : '';
  if(!u || u==='__new__'){
    const extra=el && el.closest('.field') && el.closest('.field').querySelector('.unit-new');
    u=extra ? String(extra.value||'').trim() : '';
  }
  return rememberUnit(u||fallback||'عدد');
}
function setUnitSelect(id, unit){
  const sel=$(id); if(!sel) return;
  const u=rememberUnit(unit||'عدد');
  if(![...sel.options].some(o=>o.value===u)){
    const opt=document.createElement('option');
    opt.value=u; opt.textContent=u;
    const last=[...sel.options].find(o=>o.value==='__new__');
    sel.insertBefore(opt, last||null);
  }
  sel.value=u;
}

}

    $('#newMatBox').classList.toggle('open');
    $('#togNewMat').classList.toggle('on');
    if($('#buyMatSug')) $('#buyMatSug').classList.remove('open');
    if($('#newMatBox').classList.contains('open') && $('#nmName')) $('#nmName').focus();
  };
  if($('#togNewSvc')) $('#togNewSvc').onclick=()=>{
    $('#newSvcBox').classList.toggle('open');
    $('#togNewSvc').classList.toggle('on');
    if($('#svcSug')) $('#svcSug').classList.remove('open');
    if($('#newSvcBox').classList.contains('open') && $('#nsTitle')) $('#nsTitle').focus();
  };
  if($('#saveNewMatQuick')) $('#saveNewMatQuick').onclick=()=>{
    const name=($('#nmName').value||'').trim();
    const unit=readUnit('#nmUnit','عدد');
    if(!name){ toast('نام کالا لازم است',false); return; }
    let mat=alive(DB.materials).find(m=>String(m.name).trim()===name);
    if(!mat){
      mat={id:uid('mat'), name, unit, unitCost:0, notes:'', deleted:'0'};
      upsertLocal('materials',mat);
      flush();
    }
    pickMat(mat);
    $('#newMatBox').classList.remove('open');
    $('#togNewMat').classList.remove('on');
    $('#nmName').value='';
    toast('به فهرست کالاها اضافه شد');
  };
  if($('#saveNewSvcQuick')) $('#saveNewSvcQuick').onclick=()=>{
    const unit=readUnit('#nsUnit','عدد');
    const title=addServiceToCatalog($('#nsTitle').value, unit);
    if(!title){ toast('عنوان خدمت لازم است',false); return; }
    pickSvc({name:title, unit});
    $('#newSvcBox').classList.remove('open');
    $('#togNewSvc').classList.remove('on');
    $('#nsTitle').value='';
    flush();
    toast('به فهرست خدمات اضافه شد');
  };
  const recBuy=({kind,title,materialId,qty,total,unit})=>{
    upsertLocal('purchases',{
      id:uid('buy'), kind, title, materialId:materialId||'', qty, totalAmount:total,
      unitPrice: qty>0? total/qty : total, unit:unit||'عدد',
      dateShamsi:shamsiShort(), dateGregorian:nowIso(), notes:'', deleted:'0'
    });
    flush();
  };
  if($('#saveBuyMat')) $('#saveBuyMat').onclick=async()=>{
    const name=($('#buyName').value||'').trim();
    const qty=num($('#buyQty').value), total=num($('#buyTotal').value), unit=readUnit('#buyUnit','عدد');
    if(!name){ toast('نام کالا لازم است',false); return; }
    if(!(qty>0) || !(total>0)){ toast('تعداد و مبلغ کل را وارد کنید',false); return; }
    const unitPrice=total/qty;
    let mat=alive(DB.materials).find(m=>String(m.name).trim()===name);
    if(mat){
      if(Math.abs(num(mat.unitCost)-unitPrice)>0.5){
        const ok=await priceChangeConfirm({name, oldPrice:num(mat.unitCost), newPrice:unitPrice});
        if(!ok) return;
        mat.unitCost=unitPrice;
      }
      if(unit && mat.unit!==unit) mat.unit=unit;
      upsertLocal('materials',mat);
    }else{
      mat={id:uid('mat'), name, unit, unitCost:unitPrice, notes:'خرید ثبت‌شده', deleted:'0'};
      upsertLocal('materials',mat);
    }
    recBuy({kind:'material', title:name, materialId:mat.id, qty, total, unit});
    toast('خرید کالا ثبت شد'); render();
  };
  if($('#saveBuySvc')) $('#saveBuySvc').onclick=async()=>{
    let title=($('#svcTitle').value||'').trim();
    const qty=num($('#svcQty').value), total=num($('#svcTotal').value);
    if(!title){ toast('عنوان خدمت لازم است',false); return; }
    if(!title.startsWith('خدمات')) title='خدمات '+title;
    if(!(qty>0) || !(total>0)){ toast('تعداد و مبلغ کل را وارد کنید',false); return; }
    const unitPrice=total/qty;
    const prev=alive(DB.purchases).filter(p=>p.kind==='service' && p.title===title)
      .sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];
    if(prev && Math.abs(num(prev.unitPrice)-unitPrice)>0.5){
      const ok=await priceChangeConfirm({name:title, oldPrice:num(prev.unitPrice), newPrice:unitPrice});
      if(!ok) return;
    }
    const unit=readUnit('#svcUnit', (prev&&prev.unit)||'عدد');
    addServiceToCatalog(title, unit);
    recBuy({kind:'service', title, qty, total, unit});
    toast('پرداخت خدمات ثبت شد'); render();
  };
  $$('[data-del-buy]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('حذف سند','این خرید/پرداختی حذف شود؟')) return;
    const rec=byId(DB.purchases,b.dataset.delBuy); rec.deleted='1'; upsertLocal('purchases',rec); render();
  });
}

function periodStart(key){
  const d=new Date();
  if(key==='1W') d.setDate(d.getDate()-7);
  else if(key==='1M') d.setMonth(d.getMonth()-1);
  else if(key==='1Y') d.setFullYear(d.getFullYear()-1);
  else return new Date(2000,0,1);
  return d;
}
function viewAccounting(){
  const per = (window._accPer)||'ALL';
  const from=periodStart(per).getTime();
  const orders=alive(DB.orders).filter(o=>new Date(o.dateGregorian||o.createdAt).getTime()>=from);
  const pays=alive(DB.payments).filter(p=>new Date(p.dateGregorian||p.createdAt).getTime()>=from);
  const buys=alive(DB.purchases).filter(p=>new Date(p.dateGregorian||p.createdAt).getTime()>=from);
  const sale=orders.reduce((s,o)=>s+num(o.totalSale),0);
  const rec=pays.reduce((s,p)=>s+num(p.amount),0);
  const expense=buys.reduce((s,p)=>s+num(p.totalAmount),0);
  const net=rec-expense;
  let remain=0;
  alive(DB.customers).forEach(c=>{ remain += ledger(c.id).debt; });
  const tx=[
    ...orders.map(o=>({t:o.dateGregorian,d:o.dateShamsi,k:'فروش',n:'فاکتور '+o.invoiceNo+' — '+o.customerName,a:num(o.totalSale),id:o.id,kind:'o'})),
    ...pays.map(p=>{
      const c=byId(DB.customers,p.customerId);
      return {t:p.dateGregorian,d:p.dateShamsi,k:'دریافت',n:(c?c.name:'مشتری')+' — '+ (p.method||''),a:num(p.amount),id:p.id,kind:'p'};
    }),
    ...buys.map(p=>({t:p.dateGregorian,d:p.dateShamsi,k:p.kind==='service'?'هزینه خدمات':'خرید کالا',n:p.title,a:-num(p.totalAmount),id:p.id,kind:'b'}))
  ].sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  const trows=tx.map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.k)}</td><td>${esc(x.n)}</td><td>${money(x.a)}</td>
    <td>${x.kind==='p'?`<button class="btn btn-d" data-del-pay="${x.id}">حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">تراکنشی نیست.</td></tr>';
  const crows=alive(DB.customers).map(c=>{
    const L=ledger(c.id);
    return `<tr class="clickable" data-open-cus="${c.id}"><td>${esc(c.name)}</td><td>${money(L.totalSale)}</td><td>${money(L.totalPaid)}</td><td>${money(L.debt)}</td></tr>`;
  }).join('');
  return `<div class="page-head"><h1>حسابداری</h1><button class="btn btn-g" data-go="dashboard">بازگشت</button></div>
  <div class="filters">${['1W','1M','1Y','ALL'].map(k=>`<button class="chip ${per===k?'on':''}" data-per="${k}">${k}</button>`).join('')}</div>
  <div class="stats" style="margin-top:12px">
    <div class="stat"><span>مجموع فروش</span><b>${money(sale)}</b></div>
    <div class="stat"><span>مجموع دریافتی‌ها</span><b>${money(rec)}</b></div>
    <div class="stat"><span>خرید و هزینه‌ها</span><b>${money(expense)}</b></div>
    <div class="stat"><span>درآمد خالص</span><b>${money(net)}</b></div>
    <div class="stat"><span>مطالبات باقی‌مانده</span><b>${money(remain)}</b></div>
  </div>
  <div class="card"><h3>گزارش تراکنش‌ها</h3><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>شرح</th><th>مبلغ</th><th></th></tr></thead><tbody>${trows}</tbody></table></div></div>
  <div class="card" style="margin-top:12px"><h3>پرتفوی مالی مشتریان</h3><div class="table-wrap"><table><thead><tr><th>مشتری</th><th>فروش</th><th>دریافتی</th><th>مانده</th></tr></thead><tbody>${crows}</tbody></table></div></div>`;
}

function prevDebt(order){
  if(!order.customerId) return 0;
  return ledger(order.customerId).orders.filter(r=>r.order.id!==order.id).reduce((s,r)=>s+r.bal,0);
}
function invoiceHead(order, pageNo){
  return `<div class="inv-head">
    <div class="inv-meta">تاریخ: ${faDigits(order.dateShamsi||'')}<br>شماره سریال: ${faDigits(order.invoiceNo||'')}${pageNo>1?'<br>صفحه '+faDigits(pageNo):''}</div>
    <div class="inv-title">پیش‌فاکتور</div>
    <img class="inv-logo-py" src="logo-py.png" alt="PezeshkYar" onerror="this.src='logo.png'">
  </div>`;
}
function invoicePagesHTML(order){
  const items=orderItems(order.id);
  const debt=prevDebt(order);
  const payable=num(order.totalSale);
  const firstMax = items.length>7 ? 7 : items.length;
  const chunks=[items.slice(0, firstMax)];
  for(let i=firstMax;i<items.length;i+=12) chunks.push(items.slice(i,i+12));
  if(!chunks.length) chunks.push([]);
  const noteLines = String(order.notes||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  return chunks.map((chunk,idx)=>{
    const last = idx===chunks.length-1;
    const start = idx===0 ? 0 : firstMax + (idx-1)*12;
    const rows = chunk.map((it,i)=>`<tr>
      <td>${faDigits(start+i+1)}</td>
      <td>${faDigits(it.productCode)}</td>
      <td>${esc(it.productName)}</td>
      <td>${faDigits(it.qty)}</td>
      <td>${faMoney(it.unitPrice)}</td>
      <td>${faMoney(it.saleAmount)}</td>
    </tr>`).join('') || `<tr><td colspan="6">بدون کالا</td></tr>`;
    const parties = idx===0 ? `
      <tr><th class="sec" colspan="6">مشخصات فروشنده</th></tr>
      <tr>
        <td class="start" colspan="4">نام شخص حقیقی / حقوقی : پزشک یار</td>
        <td colspan="2">تلفن: ${faDigits(APP.SELLER_PHONE)}</td>
      </tr>
      <tr><th class="sec" colspan="6">مشخصات خریدار</th></tr>
      <tr><td class="start" colspan="6">نام شخص حقیقی / حقوقی : ${esc(order.customerName||'')}</td></tr>
      <tr>
        <td class="start" colspan="3">استان: </td>
        <td class="start" colspan="3">شهرستان: </td>
      </tr>
      <tr>
        <td class="start" colspan="4">نشانی : ${esc(order.customerAddress||'')}</td>
        <td colspan="2">تلفن: ${faDigits(order.customerPhone||'')}</td>
      </tr>` : '';
    const goodsHead = `<tr><th class="sec" colspan="6">مشخصات کالا</th></tr>
      <tr>
        <th style="width:7%">ردیف</th>
        <th style="width:10%">کد کالا</th>
        <th class="name-col">شرح کالا</th>
        <th style="width:8%">تعداد</th>
        <th class="num-col">مبلغ واحد(ریال)</th>
        <th class="num-col">مبلغ کل (ریال)</th>
      </tr>`;
    const more = last ? '' : `<tr><td colspan="6">ادامه در صفحه بعد…</td></tr>`;
    const foot = last ? `
      <tr>
        <td colspan="2" style="font-weight:800">جمع کل قابل پرداخت:</td>
        <td colspan="4" style="font-weight:800">${faMoney(payable)} ریال</td>
      </tr>
      <tr>
        <td style="font-weight:800;width:12%">توضیحات:</td>
        <td class="start" colspan="5">
          شماره شبا: ${esc(APP.IBAN)}<br>
          شماره کارت: ${faDigits(APP.CARD)}<br>
          به نام: ${esc(APP.ACCOUNT)}
          ${debt>0.5?`<br>بدهی پیشین مشتری: ${faMoney(debt)} ریال`:''}
          ${noteLines.map(n=>`<br>• ${esc(n)}`).join('')}
        </td>
      </tr>` : more;
    const signs = last ? `<div class="inv-sign"><span>مهر و امضاء فروشنده :</span><span>مهر و امضاء خریدار :</span></div>` : '';
    return `<section class="a4 land" data-page="${idx+1}">
      ${invoiceHead(order, idx+1)}
      <table class="inv-sheet">
        ${parties}
        ${goodsHead}
        ${rows}
        ${foot}
      </table>
      ${signs}
    </section>`;
  }).join('');
}

  return `<section class="a4">
    <div class="inv-top"><div><img class="inv-logo" src="logo.png"><div>لیست اپراتور</div></div>
    <div>سفارش ${esc(o.invoiceNo)}<br>${esc(o.dateShamsi)}<br>${esc(o.customerName)}</div></div>
    <table><thead><tr><th>ردیف</th><th>کد</th><th>نام</th><th>سفارش</th><th>تولیدشده</th><th>باقی</th></tr></thead><tbody>${rows}</tbody></table>
  </section>`;
}
function showOperator(id){
  const o=byId(DB.orders,id); if(!o) return;
  const m=$('#modal'); m.className='modal-bg show';
  m.innerHTML=`<div class="modal" style="width:min(920px,100%);max-height:92vh;overflow:auto">
    <div class="row-actions"><button class="btn btn-p" id="dlOp">دانلود PNG ZIP</button><button class="btn" onclick="window.print()">چاپ</button><button class="btn btn-g" id="clOp">بستن</button></div>
    <div class="a4-stage" id="opStage">${operatorHTML(o)}</div></div>`;
  $('#clOp').onclick=()=>m.className='modal-bg';
  $('#print-root').innerHTML=operatorHTML(o);
  $('#dlOp').onclick=()=>downloadZip(o,'operator');
}
async function downloadZip(order, kind){
  if(!window.html2canvas || !window.JSZip){ toast('کتابخانه دانلود در دسترس نیست',false); return; }
  const html = kind==='operator' ? operatorHTML(order) : invoicePagesHTML(order);
  const hold=document.createElement('div');
  hold.style.cssText='position:fixed;left:-10000px;top:0;';
  hold.innerHTML=html;
  document.body.appendChild(hold);
  const zip=new JSZip();
  const pages=[...hold.querySelectorAll('.a4')];
  for(let i=0;i<pages.length;i++){
    const canvas=await html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const data=canvas.toDataURL('image/png').split(',')[1];
    zip.file(`PezeshkYar-${kind}-${order.invoiceNo}-p${i+1}.png`, data, {base64:true});
  }
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`PezeshkYar-${kind}-${order.invoiceNo}.zip`;
  a.click();
  hold.remove();
  toast('فایل ZIP آماده شد');
}

function render(){
  const v=$('#view');
  if(route.page==='dashboard') v.innerHTML=viewDashboard();
  else if(route.page==='new-order'){
    if(!draft) draft=freshDraft('…');
    v.innerHTML=viewNewOrder(); bindNewOrder();
    if(String(draft.invoiceNo)==='…'){
      nextInvoice().then(n=>{ if(draft && String(draft.invoiceNo)==='…'){ draft.invoiceNo=n; const el=$('#cInv'); if(el) el.value=n; }});
    }
  }
  else if(route.page==='orders') v.innerHTML=viewOrders();
  else if(route.page==='order'){ v.innerHTML=viewOrder(route.id); const o=byId(DB.orders,route.id); if(o) bindOrder(o); }
  else if(route.page==='customers') v.innerHTML=viewCustomers();
  else if(route.page==='customer') v.innerHTML=viewCustomer(route.id);
  else if(route.page==='accounting') v.innerHTML=viewAccounting();
  else if(route.page==='purchases'){ v.innerHTML=viewPurchases(); bindPurchases(); }
  else if(route.page==='products') v.innerHTML=viewProducts();
  else if(route.page==='products-add') v.innerHTML=viewProductsAdd();
  else if(route.page==='materials') v.innerHTML=viewMaterials();
  else if(route.page==='formula') v.innerHTML=viewFormula();
  bindGlobal();
  renderStatus();
  if(typeof syncMobNav==='function') syncMobNav();
}

function bindGlobal(){
  bindUnitSelects($('#view'));
  $$('#view [data-go]').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();
    go(el.dataset.go, el.dataset.id);
  }));
  const oq=$('#ordQ'); if(oq) oq.oninput=()=>render();
  $$('[data-open-order]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('button')) return; go('order', tr.dataset.openOrder); });
  $$('[data-del-order]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!await confirmBox('حذف سفارش','این سفارش به‌صورت نرم حذف شود؟')) return;
    const o=byId(DB.orders,b.dataset.delOrder); o.deleted='1'; upsertLocal('orders',o);
    orderItems(o.id).forEach(it=>{it.deleted='1'; upsertLocal('orderItems',it);});
    toast('سفارش حذف شد'); render();
  });
  $$('[data-inv]').forEach(b=>b.onclick=()=>showInvoice(b.dataset.inv));
  $$('[data-op]').forEach(b=>b.onclick=()=>showOperator(b.dataset.op));
  const cf=$('#cusAddForm');
  if(cf) cf.onsubmit=e=>{
    e.preventDefault();
    const c=addCustomer($('#nName')&&$('#nName').value, $('#nPhone')&&$('#nPhone').value, $('#nAddr')&&$('#nAddr').value);
    if(c) render();
  };
  $$('[data-open-cus]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('button')) return; go('customer', tr.dataset.openCus); });
  $$('[data-del-cus]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!await confirmBox('حذف مشتری','مشتری حذف شود؟')) return;
    const c=byId(DB.customers,b.dataset.delCus); c.deleted='1'; upsertLocal('customers',c); render();
  });
  $$('[data-ed-cus]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const c=byId(DB.customers,b.dataset.edCus);
    const m=$('#modal'); m.className='modal-bg show';
    m.innerHTML=`<div class="modal"><h3>ویرایش مشتری</h3>
      <div class="field"><label>نام</label><input class="inp" id="eN" value="${esc(c.name)}"></div>
      <div class="field"><label>تماس</label><input class="inp" id="eP" value="${esc(c.phone)}"></div>
      <div class="field"><label>آدرس</label><textarea class="inp" id="eA">${esc(c.address||'')}</textarea></div>
      <div class="row-actions"><button class="btn btn-g" id="eX">بستن</button><button class="btn btn-p" id="eS">ذخیره</button></div></div>`;
    $('#eX').onclick=()=>m.className='modal-bg';
    $('#eS').onclick=()=>{ c.name=$('#eN').value.trim(); c.phone=$('#eP').value.trim(); c.address=$('#eA').value.trim(); upsertLocal('customers',c); m.className='modal-bg'; render(); };
  });
  const sp=$('#savePay'); if(sp) sp.onclick=()=>{
    const amt=num($('#payAmt').value); if(!amt){ toast('مبلغ را وارد کنید',false); return; }
    upsertLocal('payments',{id:uid('pay'),customerId:route.id,orderId:'',amount:amt,method:$('#payMet').value,dateShamsi:$('#payDate').value,dateGregorian:parseShamsi($('#payDate').value).toISOString(),notes:$('#payNote').value,deleted:'0'});
    applySettleFlags(route.id); toast('پرداخت ثبت شد'); render();
  };
  $$('[data-del-pay]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('حذف تراکنش','این پرداختی حذف شود؟')) return;
    const p=byId(DB.payments,b.dataset.delPay); p.deleted='1'; upsertLocal('payments',p);
    if(p.customerId) applySettleFlags(p.customerId);
    render();
  });
  $$('[data-per]').forEach(b=>b.onclick=()=>{ window._accPer=b.dataset.per; render(); });
  if($('#prMatList')) bindProductMats();
  const spr=$('#savePr'); if(spr) spr.onclick=()=>{
    const code=$('#prCode').value.trim(), name=$('#prName').value.trim();
    if(!code||!name){ toast('کد و نام لازم است',false); return; }
    const selected=[];
    $$('#prMatList [data-pmid]').forEach(cb=>{
      if(!cb.checked) return;
      const qty=Math.max(0,num(($(`[data-pmqty="${cb.dataset.pmid}"]`)||{}).value));
      if(qty>0) selected.push({materialId:cb.dataset.pmid, qty});
    });
    let cost=0;
    selected.forEach(s=>{ const m=byId(DB.materials,s.materialId); cost += num(m&&m.unitCost)*s.qty; });
    if(!cost) cost=num($('#prMc').value);
    const sale=num($('#prSale').value);
    const rec=snapshotProduct({id:uid('prd'),code,name,category:$('#prCat').value.trim()||APP.CATEGORY,unit:readUnit('#prUnit','عدد'),notes:'',deleted:'0'}, sale||cost, cost);
    upsertLocal('products',rec);
    selected.forEach(s=>upsertLocal('productMaterials',{id:uid('bom'),productId:rec.id,materialId:s.materialId,qty:s.qty,deleted:'0'}));
    toast('محصول ذخیره شد'); render();
  };
  const sm=$('#saveMat'); if(sm) sm.onclick=()=>{
    const name=$('#mName').value.trim(); if(!name){ toast('نام ماده لازم است',false); return; }
    upsertLocal('materials',{id:uid('mat'),name,unit:readUnit('#mUnit','عدد'),unitCost:num($('#mCost').value),notes:'',deleted:'0'});
    toast('ماده اولیه ذخیره شد'); render();
  };
  if($('#matList')) bindFormulaLive();
  const sb=$('#saveBom'); if(sb) sb.onclick=()=>{
    const pid=$('#bomP')&&$('#bomP').value;
    if(!pid){ toast('محصول را انتخاب کنید',false); return; }
    const selected=[];
    $$('#matList [data-mid]').forEach(cb=>{
      if(!cb.checked) return;
      const qty=Math.max(0,num(($(`[data-mqty="${cb.dataset.mid}"]`)||{}).value));
      if(qty>0) selected.push({materialId:cb.dataset.mid, qty});
    });
    alive(DB.productMaterials).filter(b=>b.productId===pid).forEach(b=>{
      if(!selected.find(s=>s.materialId===b.materialId)){ b.deleted='1'; upsertLocal('productMaterials',b); }
    });
    selected.forEach(s=>{
      const exist=DB.productMaterials.find(b=>b.productId===pid && b.materialId===s.materialId);
      const rec=exist?Object.assign({},exist):{id:uid('bom')};
      rec.productId=pid; rec.materialId=s.materialId; rec.qty=s.qty; rec.deleted='0';
      upsertLocal('productMaterials',rec);
    });
    const prod=byId(DB.products,pid);
    if(prod){ snapshotProduct(prod, productSale(prod), productCost(prod)); upsertLocal('products',prod); }
    toast('فرمول ذخیره شد'); render();
  };
  $$('[data-del-pr]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('حذف محصول','محصول حذف شود؟')) return;
    const p=byId(DB.products,b.dataset.delPr); p.deleted='1'; upsertLocal('products',p); render();
  });
  $$('[data-ed-pr]').forEach(b=>b.onclick=()=>{
    const p=byId(DB.products,b.dataset.edPr);
    const cost=productCost(p), sale=productSale(p);
    const m=$('#modal'); m.className='modal-bg show';
    m.innerHTML=`<div class="modal"><h3>ویرایش محصول</h3>
      <div class="grid-2"><div class="field"><label>کد</label><input class="inp" id="xC" value="${esc(p.code)}"></div><div class="field"><label>نام</label><input class="inp" id="xN" value="${esc(p.name)}"></div></div>
      <div class="field"><label>واحد</label>${unitSelectHTML('xU', p.unit||'عدد')}</div>
      <div class="field"><label>قیمت فروش</label><input class="inp" id="xS" type="number" value="${sale}"></div>
      <div class="field"><label>هزینه مواد (دستی)</label><input class="inp" id="xM" type="number" value="${num(p.materialCost)}"></div>
      <p class="pmeta">قیمت تمام‌شده از فرمول: <b>${money(cost)}</b> — درصد سود: <b>${pctTxt(productProfitPct(p,cost))}</b></p>
      <div class="row-actions"><button class="btn btn-g" id="xx">بستن</button><button class="btn btn-p" id="xs">ذخیره</button></div></div>`;
    bindUnitSelects(m);
    $('#xx').onclick=()=>m.className='modal-bg';
    $('#xs').onclick=()=>{
      p.code=$('#xC').value; p.name=$('#xN').value; p.unit=readUnit('#xU', p.unit||'عدد');
      const bomCost=productCost(p);
      snapshotProduct(p, num($('#xS').value), bomCost>0?bomCost:num($('#xM').value));
      upsertLocal('products',p); m.className='modal-bg'; render();
    };
  });
  $$('[data-del-mat]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('حذف ماده','ماده اولیه حذف شود؟')) return;
    const m=byId(DB.materials,b.dataset.delMat); m.deleted='1'; upsertLocal('materials',m); render();
  });
  $$('[data-ed-mat]').forEach(b=>b.onclick=()=>{
    const mat=byId(DB.materials,b.dataset.edMat);
    const m=$('#modal'); m.className='modal-bg show';
    m.innerHTML=`<div class="modal"><h3>ویرایش ماده</h3>
      <div class="field"><label>نام</label><input class="inp" id="mn" value="${esc(mat.name)}"></div>
      <div class="field"><label>واحد</label>${unitSelectHTML('mu', mat.unit||'عدد')}</div>
      <div class="field"><label>قیمت</label><input class="inp" id="mc" type="number" value="${num(mat.unitCost)}"></div>
      <div class="row-actions"><button class="btn btn-g" id="mx">بستن</button><button class="btn btn-p" id="ms">ذخیره</button></div></div>`;
    bindUnitSelects(m);
    $('#mx').onclick=()=>m.className='modal-bg';
    $('#ms').onclick=()=>{ mat.name=$('#mn').value; mat.unit=readUnit('#mu', mat.unit||'عدد'); mat.unitCost=num($('#mc').value); upsertLocal('materials',mat); m.className='modal-bg'; render(); };
  });
}

async function boot(){
  document.getElementById('appVer').textContent=APP.version;
  detectPlatform();
  window.addEventListener('resize', ()=>detectPlatform());
  window.addEventListener('orientationchange', ()=>setTimeout(detectPlatform, 200));
  setTheme(localStorage.getItem('py_theme')||'light');
  $('#btnTheme').onclick=()=>setTheme(document.documentElement.classList.contains('dark')?'light':'dark');
  $$('.topbar [data-go], #mobNav [data-go], #mobSheet [data-go]').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();
    const sheet=$('#mobSheet'); if(sheet) sheet.classList.remove('open');
    go(el.dataset.go, el.dataset.id);
  }));
  const more=$('#mobMore');
  if(more) more.onclick=e=>{ e.preventDefault(); $('#mobSheet').classList.toggle('open'); };
  document.addEventListener('submit', ev=>{
    if(ev.target && ev.target.id==='cusAddForm'){
      ev.preventDefault();
      const c=addCustomer($('#nName')&&$('#nName').value, $('#nPhone')&&$('#nPhone').value, $('#nAddr')&&$('#nAddr').value);
      if(c) render();
    }
  });
  document.addEventListener('click', ev=>{
    if(ev.target.closest('#cSearch') || ev.target.closest('#cSug')) return;
    if(ev.target.closest('#pSearch') || ev.target.closest('#pSug')) return;
    if(ev.target.closest('#buyName') || ev.target.closest('#buyMatSug') || ev.target.closest('#buyMenu')) return;
    if(ev.target.closest('#svcTitle') || ev.target.closest('#svcSug') || ev.target.closest('#svcMenu')) return;
    ['#cSug','#pSug','#buyMatSug','#svcSug'].forEach(id=>{ const el=$(id); if(el) el.classList.remove('open'); });
  });
  tick(); setInterval(tick,1000);
  window.addEventListener('online',()=>{ renderStatus(); if(ready) flush(); });
  window.addEventListener('offline',()=>{ lastError='اتصال اینترنت قطع است.'; renderStatus(); toast('اتصال اینترنت قطع است',false); });
  loadLocal();
  render();
  try{
    await bootstrap();
    ready=true; $('#lock').classList.add('hide');
    render();
    toast('اطلاعات از Google Sheets بازیابی شد');
  }catch(e){
    lastError = navigator.onLine ? (e.message||'خطای بازیابی') : 'اتصال اینترنت قطع است.';
    ready=true; $('#lock').classList.add('hide');
    render();
    toast('بازیابی از گوگل ناموفق بود. صف اضطراری محلی فعال است.', false);
  }
  setInterval(()=>{ if(ready) flush(); }, 30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && ready) flush(); });
}
boot();
